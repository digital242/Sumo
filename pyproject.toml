[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sumo-ai"
version = "0.1.0"
description = "Sumo: a local-first personal AI framework that runs on your own devices."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sumo contributors" }]
keywords = ["ai", "agents", "local-first", "llm", "ollama", "personal-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Sumo's core runs on the Python standard library only, so a fresh clone
# works with zero third-party installs. Extras add optional integrations.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/digital242/sumo"
Repository = "https://github.com/digital242/sumo"

[project.scripts]
sumo = "sumo.cli:main"

[tool.setuptools.packages.find]
include = ["sumo*"]
